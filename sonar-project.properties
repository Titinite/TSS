# SonarQube Cloud — https://sonarcloud.io/project/overview?id=Titinite_TSS
sonar.organization=titinite
sonar.projectKey=Titinite_TSS
sonar.projectName=The Seventh Shard

sonar.sources=apps,packages
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts
sonar.coverage.exclusions=**/*.config.*,**/index.ts

# One lcov report per package (add new packages here)
sonar.javascript.lcov.reportPaths=packages/shared/coverage/lcov.info

# Fail the CI when the quality gate fails
sonar.qualitygate.wait=true
