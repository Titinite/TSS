name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # On PRs, only run tasks for the packages affected by the change.
  TURBO_FLAGS: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm turbo run lint $TURBO_FLAGS

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm turbo run typecheck $TURBO_FLAGS

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test $TURBO_FLAGS
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            packages/*/coverage/lcov.info
            apps/*/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tss
          POSTGRES_PASSWORD: tss
          POSTGRES_DB: tss_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tss"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tss:tss@localhost:5432/tss_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test:integration $TURBO_FLAGS

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dockerfiles: ${{ steps.docker.outputs.list }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build $TURBO_FLAGS
      - name: List Dockerfiles
        id: docker
        run: |
          list=$(find docker -maxdepth 1 -name '*.Dockerfile' -printf '"%f",' | sed 's/,$//')
          echo "list=[${list}]" >> "$GITHUB_OUTPUT"

  docker:
    name: Docker image (${{ matrix.dockerfile }})
    needs: build
    if: needs.build.outputs.dockerfiles != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.build.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

  sonar:
    name: SonarQube Cloud
    needs: test
    # Dependabot PRs have no access to secrets
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          name: coverage
        continue-on-error: true
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-success:
    name: CI ✓
    if: always()
    needs: [lint, typecheck, test, integration, build, docker, sonar]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded (or was skipped)
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "At least one job failed." && exit 1
          fi
